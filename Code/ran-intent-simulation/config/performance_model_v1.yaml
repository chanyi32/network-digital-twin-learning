      videoThroughputMeanMbps: 16.50
      videoThroughputP05Mbps: 15.00
      videoDelayMeanMs: 38.00
      videoDelayP95Ms: 44.00
      videoUplinkBlerMean: 0.05
      voiceQualityScore: 0.97
